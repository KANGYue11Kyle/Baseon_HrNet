CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true

GPUS: (0,)
OUTPUT_DIR: 'output/2_17_4090_continue'  #'output/final_working'
LOG_DIR: 'log'
WORKERS: 2
PIN_MEMORY: true
PRINT_FREQ: 5

DATASET:
  DATASET: surgery
  ROOT: 'data/surgery'
  TRAIN_SET: 'lists/train.txt'
  TEST_SET: 'lists/val.txt'
  NUM_CLASSES: 10

MODEL:
  NAME: seg_hrnet
  NUM_OUTPUTS: 1
  PRETRAINED: 'F:\download\HRNet-Semantic-Segmentation-HRNet-OCR\pretrained_models\hrnetv2_w18_imagenet_pretrained.pth'
  EXTRA:
    FINAL_CONV_KERNEL: 1
    STAGE1:
      NUM_MODULES: 1
      NUM_BRANCHES: 1
      BLOCK: BOTTLENECK
      NUM_BLOCKS: [4]
      NUM_CHANNELS: [64]
      FUSE_METHOD: SUM
    STAGE2:
      NUM_MODULES: 1
      NUM_BRANCHES: 2
      BLOCK: BASIC
      NUM_BLOCKS: [4, 4]
      NUM_CHANNELS: [18, 36]
      FUSE_METHOD: SUM
    STAGE3:
      NUM_MODULES: 2 #4
      NUM_BRANCHES: 3
      BLOCK: BASIC
      NUM_BLOCKS: [4,4,4]
      NUM_CHANNELS: [18, 36, 72]
      FUSE_METHOD: SUM
    STAGE4:
      NUM_MODULES: 2 #3
      NUM_BRANCHES: 4
      BLOCK: BASIC
      NUM_BLOCKS: [4,4,4,4]
      NUM_CHANNELS: [18, 36, 72, 144]
      FUSE_METHOD: SUM

LOSS:
  USE_OHEM: true
  OHEMTHRES: 0.7
  OHEMKEEP: 10000
  BALANCE_WEIGHTS: [1]
  CLASS_WEIGHTS: [0.1, 3.5, 1.8, 2.0, 2.0, 4.0, 5.0, 19.0, 2.0, 0.9]

TRAIN:
  IMAGE_SIZE: [512, 288]
  BASE_SIZE: 521
  BATCH_SIZE_PER_GPU: 4
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 100
  RESUME: true #false
  OPTIMIZER: sgd
  LR: 0.0000016003 #0.00000729 #0.01 
  WD: 0.0001 #0.0001
  MOMENTUM: 0.9
  NESTEROV: true #false
  FLIP: true
  MULTI_SCALE: false #true
  IGNORE_LABEL: 255
  SCALE_FACTOR: 8

TEST:
  IMAGE_SIZE: [512,288] 
  BASE_SIZE: 512
  BATCH_SIZE_PER_GPU: 4
  FLIP_TEST: true
  MULTI_SCALE: false #true
  MODEL_FILE: "F:/download/HRNet-Semantic-Segmentation-HRNet-OCR/output/surgery_pic/surgery/seg_hrnet_ocr_w48_surgery/checkpoint.pth.tar"